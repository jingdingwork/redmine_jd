services:
  db:
    image: mysql:8.0
    container_name: redmine-mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${REDMINE_DB_DATABASE:-redmine}
      MYSQL_USER: ${REDMINE_DB_USERNAME:-redmine}
      MYSQL_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redmine:
    image: redmine-jd:latest
    container_name: redmine-jd
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"            # 服务器上访问 http://<服务器IP>:3000
    environment:
      REDMINE_DB_HOST: db
      REDMINE_DB_PORT: "3306"
      REDMINE_DB_DATABASE: ${REDMINE_DB_DATABASE:-redmine}
      REDMINE_DB_USERNAME: ${REDMINE_DB_USERNAME:-redmine}
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:-redmine}
      TZ: Asia/Shanghai
    volumes:
      - redmine-files:/redmine-data   # 上传附件 + secret_key_base 持久化
    restart: unless-stopped

volumes:
  mysql-data:
  redmine-files:
